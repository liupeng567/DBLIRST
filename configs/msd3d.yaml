# M2 基线：T-MSD3D 离散时序（多尺度帧差 + 3D conv，等参数量 ≈MSHNet）
# 口径：表 T 训练超参（AdamW 3e-4 + warmup + cosine），AMP bf16（8GB 显存适配）
defaults:
  - base
  - _self_

experiment:
  name: msd3d_B
  stage: B

model:
  type: msd3d
  in_ch: 1
  # channels 默认 (10,19,38,76,152)：4.196M vs MSHNet 4.066M（ratio 1.033，±5% 内）

data:
  mode: window
  split: train-int
  crop: [240, 320]    # 整窗一致裁剪（2.6 允许的几何变换），8GB 显存适配；推理全幅
  augment: true
  num_workers: 0     # 同上；时序窗 T=32 加载 ≈0.5s 仍可接受

train:
  epochs: 15
  save_every: 3
  warm_epoch: 2       # 时序模型状态建立更快，提前进入深监督
  grad_clip: 1.0
  amp: bf16
  window: {T: 32, stride: 8}
  batch: {windows_per_gpu: 1, accum: 4}   # 等效批 4 窗 = 128 帧/step（显存约束）
  optim: {name: adamw, lr: 3.0e-4, wd: 0.01, warmup: 500, cosine_min: 3.0e-5}
