# M3 双状态液态核配置（方案 §8.4 骨架；键名与 dsld/train/build.py 的读取一一对账）
#
# L5 纪律：**只写当下有消费者的键**。§8.4 骨架里以下条目本轮故意不落地，落地时随消费者加入：
#   - liquid.scales: [{stride:2, h:24}]     → 双尺度（区域 stride-8）属 M3 后期/M4，
#     单尺度下 `stride` 无人读；本版用 liquid.c_h 直接给核心隐通道数。
#   - train.batch.accum / optim.*          → 梯度累积与 AdamW 分组不衰减属 P2 训练循环。
#   - train.sentinels.alpha_lo/alpha_hi    → 逐轮哨兵判定属 P2（recon_valid_min 已由
#     losses.total_loss 消费，故先落地）。
#   - eval.quick_subset / primary_iou      → 快评与分层报表属 P4。
#   - infer.threshold（前版死键）          → 彻底移除，自适应阈值判决链在 M4 方案 5.3。
model:
  type: dsld_core
  in_ch: 1
  encoder:                    # §4.2 EncoderLite：stride-2 单尺度，小目标禁 resize
    mid_ch: 16                # stem 3×3/2 输出
    out_ch: 24                # 主尺度特征通道（= 核心 c_in）
  liquid:                     # §4.3 DualStateLiquidCore
    c_h: 24                   # 隐状态通道（§8.4 的 scales[0].h）
    tau_b: {min: 24, max: 192, init: 48}   # 背景通道 τ（帧）；与 τ_T 区间不相交 ⇒ scale_ratio≥3 构造成立
    tau_t: {min: 2,  max: 8,  init: 6}     # 目标通道 τ（帧）
    state_mode: dual          # dual | single（判据 ⑥ 对照臂）
    tau_mode: normal          # normal | swap（判据 ④ 因果臂）
    mask_source: teacher      # teacher | gate | off（§4.4 课程；off = 判据 ② 保护关闭臂）
    bg_mode: learned          # learned | ema（判据 ③：学习背景 vs 经典背景减除）
    mask_decay: 0.9           # M_t = clamp(max(本帧源, 0.9·M_{t-1}), 0, cap)
    mask_radius: 5            # gate 源峰值膨胀半径（stride-2 像素 = 原生 10px）
    m_max: 0.8                # gate 源上限（L1 窒息排除出可行域）；teacher 源上限恒 1.0
    alpha_th: 0.5             # 门控判决阈（§4.3.3 运行点；val-int ROC 校准属 P4）
    ema_momentum: 0.9         # bg_mode=ema 的滑动系数，按 dt 幂次换算（0.9^dt）
    s_max: 0.7                # λ 调制包络 1 ± s_max（<1 保证 mod 恒正）
    beta_max: 1.0             # 保持项 β = beta_max·σ(θ_β)，θ_β=0 ⇒ init β=0.5
    state_dependent: false    # true ⇒ 头输入含 h（真"液态"消融 a5）
    use_checkpoint: true      # 梯度检查点（§4.9-②）。P1 实测 4060 8GB：B2×T32×crop240×320
                              # fwd+bwd 464ms/5.11GiB → checkpoint 553ms/2.61GiB（+19% 时间换
                              # 2 倍余量）。容量再往上必须开：c_h=48 不检查点时 7.86GiB 撞
                              # WDDM 显存溢出，实测 464ms → 20.4s/次（44× 悬崖，不是算力）。
  gating:                     # §4.3.3 α = sigmoid(MLP[4→hidden→1])
    hidden: 16
    bias_init: -2             # α₀ = σ(−2) = 0.1192 精确（与检测运行点解耦，L1 教训）

data:
  manifest: ittd_split_v3.json
  cache_root: data/cache/ittd

train:
  seed: 0
  window:                     # §4.7 训练档 + §5.2 采样口径
    T: 32
    stride: 8                 # 训练步距（推理步距 24 属 P4 infer_seq）
    crop: [240, 320]          # 整窗一致随机裁剪（H,W）；含"≥1 完整 GT 框"约束
    align: true               # align_to_anchor 唯一入口（L4），关闭仅供诊断
    teacher_dilate: 3         # GT 膨胀（原生像素），与 L_recon 剔除区同几何
    feature_stride: 2         # target/teacher_mask 下采样到 stride-2（块最大）
    crop_margin: 3            # 裁剪完整性判据的边距
    max_reg_fail_frac: 0.10   # R4：配准失败密度超标的窗不进索引
  loss: {seg: 1.0, recon: 0.5, gate: 0.3, dec: 0.1}   # §5.1 权重
  sentinels:
    recon_valid_min: 0.5      # §5.5：背景监督面塌缩即拦截
