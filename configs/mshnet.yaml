# M2 基线：MSHNet 单帧（CVPR 2024 忠实复现，输入 1 通道 IR）
# 口径：官方 Adagrad lr=0.05 / warm_epoch=5 / 无裁剪无 AMP；数据全幅 480×640
defaults:
  - base
  - _self_

experiment:
  name: mshnet_B
  stage: B

model:
  type: mshnet
  in_ch: 1

data:
  mode: frame
  split: train-int
  crop: null          # 全幅（方案 3.4：禁止下采样，目标过小）
  augment: true
  num_workers: 0     # 数据 17ms/项 << GPU 步 0.45s，主进程内联加载更快

train:
  epochs: 15
  save_every: 3
  warm_epoch: 5       # 官方口径：前 5 轮仅主头，之后 4 辅助头深监督
  grad_clip: 0.0      # 官方无梯度裁剪
  amp: none           # 官方 fp32
  window: {T: 1}
  batch: {windows_per_gpu: 4, accum: 1}   # 官方口径 batch=4，不累积
  optim: {name: adagrad, lr: 0.05}        # 官方优化器（恒定 lr）
